name: angle-mort-daily

on:
  schedule:
    - cron: "0 6 * * *" # 07 h à Douala
    - cron: "0 16 * * *" # 17 h à Douala
  workflow_dispatch: # lancement manuel possible

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Générer et envoyer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ github.event.schedule == '0 6 * * *' && 'matin' || 'soir' }}
        run: python main.py
      - name: Sauvegarder l'historique
        run: |
          git config user.name "angle-mort-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "maj historique" && git push)

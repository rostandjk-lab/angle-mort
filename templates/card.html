<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: [[ACCENT]]; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 675px;
      background: #050B1A;
      color: #fff;
      font-family: 'Space Grotesk', Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(620px 420px at 88% 8%, rgba(45,110,255,.50), transparent 70%),
        radial-gradient(760px 520px at 4% 108%, rgba(0,180,255,.30), transparent 70%);
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: .10;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .wrap {
      position: relative;
      height: 100%;
      padding: 52px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2em;
      color: var(--accent);
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }
    .big {
      font-size: [[BIGSIZE]]px;
      line-height: .92;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 48px color-mix(in srgb, var(--accent) 40%, transparent);
      margin-bottom: 18px;
    }
    .headline {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.12;
      max-width: 1000px;
    }
    .angle {
      font-size: 26px;
      font-weight: 500;
      line-height: 1.3;
      color: #A9B8D6;
      margin-top: 14px;
      max-width: 980px;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
    }
    .brand {
      font-weight: 700;
      letter-spacing: .24em;
    }
    .handle {
      color: #7F90B3;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span>[[KICKER]]</div>
    <div>
      <div class="big">[[BIG]]</div>
      <div class="headline">[[HEADLINE]]</div>
      <div class="angle">[[ANGLE]]</div>
    </div>
    <div class="foot"><span class="brand">ANGLE MORT</span><span class="handle">[[HANDLE]]</span></div>
  </div>
</body>
</html>

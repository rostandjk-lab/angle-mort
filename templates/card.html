<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: [[ACCENT]];
      --accent-glow: color-mix(in srgb, var(--accent) 35%, transparent);
      --accent-subtle: color-mix(in srgb, var(--accent) 12%, transparent);
      --accent-border: color-mix(in srgb, var(--accent) 45%, transparent);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 675px;
      background: #060911;
      color: #FFFFFF;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Grille et lueurs ambiantes */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, #000 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, #000 40%, transparent 85%);
    }

    .ambient-glow-1 {
      position: absolute;
      top: -100px;
      right: -80px;
      width: 650px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -120px;
      left: -80px;
      width: 600px;
      height: 450px;
      background: radial-gradient(circle, rgba(14, 55, 140, 0.3) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      pointer-events: none;
    }

    /* Cadre de briefing */
    .card-frame {
      position: relative;
      width: 1114px;
      height: 595px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: linear-gradient(135deg, rgba(11, 17, 31, 0.82) 0%, rgba(6, 9, 16, 0.90) 100%);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 42px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* Coins de visée */
    .corner-tl {
      position: absolute;
      top: -1px;
      left: -1px;
      width: 18px;
      height: 18px;
      border-top: 3px solid var(--accent);
      border-left: 3px solid var(--accent);
      border-top-left-radius: 20px;
    }
    .corner-br {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 18px;
      height: 18px;
      border-bottom: 3px solid var(--accent);
      border-right: 3px solid var(--accent);
      border-bottom-right-radius: 20px;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      padding: 6px 16px 6px 12px;
      border-radius: 100px;
      box-shadow: 0 0 16px var(--accent-subtle);
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .kicker-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .meta-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #64748B;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-tag::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* Contenu central avec rangée Hero */
    .content-zone {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .hero-texts {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .big-stat {
      font-size: [[BIGSIZE]]px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: #FFFFFF;
      background: linear-gradient(180deg, #FFFFFF 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 4px 18px var(--accent-glow));
    }

    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.22;
      color: #F8FAFC;
      letter-spacing: -0.02em;
      max-width: 780px;
    }

    /* Pod illustration Pixel Art */
    .illustration-pod {
      position: relative;
      width: 176px;
      height: 176px;
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.5),
        inset 0 0 24px rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .pod-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    .pod-svg {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pod-label {
      position: absolute;
      bottom: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      text-transform: uppercase;
      z-index: 2;
    }

    /* Callout Angle Afrique */
    .angle-callout {
      position: relative;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .angle-icon {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: var(--accent);
      font-weight: 700;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .angle-text {
      font-size: 21px;
      font-weight: 500;
      line-height: 1.35;
      color: #E2E8F0;
    }

    /* Footer */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-mark {
      width: 24px;
      height: 24px;
      background: var(--accent);
      mask: url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M3 3h8v8H3zM13 13h8v8h-8zM3 13h8v8H3z'/></svg>") no-repeat center;
      -webkit-mask: url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M3 3h8v8H3zM13 13h8v8h-8zM3 13h8v8H3z'/></svg>") no-repeat center;
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #FFFFFF;
    }

    .brand-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.12em;
      margin-left: 6px;
    }

    .handle-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      color: #94A3B8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .handle-pill span {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="grain"></div>

  <div class="card-frame">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <!-- Header bar -->
    <div class="top-bar">
      <div class="pill-kicker">
        <span class="pulse-dot"></span>
        <span class="kicker-text">[[KICKER]]</span>
      </div>
      <div class="meta-tag">ANGLE MORT · INTEL TECH</div>
    </div>

    <!-- Body content -->
    <div class="content-zone">
      <div class="hero-row">
        <div class="hero-texts">
          <div class="big-stat">[[BIG]]</div>
          <div class="headline">[[HEADLINE]]</div>
        </div>
        <div class="illustration-pod">
          <div class="pod-grid"></div>
          <div class="pod-svg">[[ILLUSTRATION]]</div>
          <div class="pod-label">[[ILLUS_TAG]]</div>
        </div>
      </div>

      <div class="angle-callout">
        <span class="angle-icon">►</span>
        <div class="angle-text">[[ANGLE]]</div>
      </div>
    </div>

    <!-- Footer bar -->
    <div class="bottom-bar">
      <div class="brand-identity">
        <div class="brand-logo-mark"></div>
        <span class="brand-name">ANGLE MORT</span>
        <span class="brand-subtitle">// ANALYSE AFRIQUE</span>
      </div>
      <div class="handle-pill">
        <span>@</span>[[HANDLE_RAW]]
      </div>
    </div>
  </div>
</body>
</html>
